<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ניהול | מייפלורז</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="admin.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="admin">
<header class="sky sky-admin">
  <div class="bar wrap">
    <a class="brand" href="../" title="לאתר">
      <span class="brand-leaf" id="brandLeaf"></span>
      <span class="brand-text"><strong>ניהול האתר</strong><small id="siteNameSmall">מייפלורז</small></span>
    </a>
    <div class="bar-tools">
      <span class="deploy" id="deployStatus" hidden></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>התנתקות</button>
    </div>
  </div>
  <div class="grass" aria-hidden="true"></div>
</header>

<main id="app" class="wrap admin-main" aria-live="polite"></main>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="admin.js"></script>
</body>
</html>
